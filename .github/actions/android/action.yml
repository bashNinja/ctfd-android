name: Android toolchain
description: JDK 21, the Android SDK and Gradle caches for the self-hosted runner.
runs:
  using: composite
  steps:
    - name: Isolate HOME and keep the large caches
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/home"
        echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
        # The SDK and Gradle caches persist between runs on purpose: they are gigabytes.
        echo "ANDROID_HOME=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$RUNNER_TOOL_CACHE/android-sdk" >> "$GITHUB_ENV"
        echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/gradle-ctfd-android" >> "$GITHUB_ENV"

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: 21

    - uses: android-actions/setup-android@v3
      with:
        packages: platform-tools build-tools;36.0.0

    - name: Describe the runner
      shell: bash
      run: |
        echo "host $(hostname), user $(id -un), $(nproc) cores"
        java -version 2>&1 | head -1
        df -h "$RUNNER_TOOL_CACHE" | tail -1
