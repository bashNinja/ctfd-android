name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/android

      # The release build is unsigned here; it still runs R8, which is where shrinking bugs show up.
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease lintDebug

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
